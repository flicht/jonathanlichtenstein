{{ if .Site.Data.homepage.contact.enable }}
{{ with .Site.Data.homepage.contact }}
  <section class="section" id="contact">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
              <div class="heading">
                <h2 class="">{{ .title | markdownify }}</h2>
            </div>
                <div class="row">
                    <div class="col-md-12 text-center">
                <div class="content">
                  <p class="fontsize27">{{ .content | markdownify }}</p>
                  <p class="fontsize21"><a href="mailto:{{ .email }}">{{ .email }}</a></p>
                  <p class="fontsize21">{{ .tel }}</p>
                  <p class="fontsize21"><a href="http://{{ .website }}">{{ .website }}</a></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
    </div>
  </section>
{{ end }}
{{ end }}

{{ if .Site.Data.homepage.promo.enable }}
{{ with .Site.Data.homepage.promo }}
<section class="bg-orange section" id="about">
  <div class="container">
    <div class="row">
      <div class="col-md-6 text-center mb-5 mb-lg-0">
        <img class="img-fluid" src="{{ .image | absURL }}" alt="">
      </div>
      <div class="col-md-6 align-self-center text-center text-md-left">
        <div class="content">
          {{ with .content1 }}<p class="text-white bembo fontsize27">{{ . | markdownify }}</p>{{ end }}
          {{ with .content2 }}<p class="text-white bembo fontsize27">{{ . | markdownify }}</p>{{ end }}
          {{ with .content3 }}<p class="text-white bembo fontsize27">{{ . | markdownify }}</p>{{ end }}
        </div>
      </div>
    </div>
  </div>
</section>
{{ end }}
{{ end }}
